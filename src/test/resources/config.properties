# Execution
execution.mode=local
browser=chrome
headless=true
implicit.wait.seconds=2
explicit.wait.seconds=10

# Application under test
ui.base.url=https://automationexercise.com
api.base.url=https://jsonplaceholder.typicode.com

# Selenium Grid (self-hosted, docker/docker-compose.yml)
grid.url=http://localhost:4444/wd/hub

# BrowserStack (credentials come from BROWSERSTACK_USERNAME / BROWSERSTACK_ACCESS_KEY env vars, never here)
browserstack.url=https://hub-cloud.browserstack.com/wd/hub
browserstack.project=Enterprise Hybrid Automation Framework
browserstack.build=local-build
browserstack.os=Windows
browserstack.osVersion=11

# Self-healing
selfhealing.report.path=target/self-healing-report.json

# Extent report
extent.report.path=target/extent-report/ExtentReport.html
